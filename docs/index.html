<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky Animation - Day/Night Cycle</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: system-ui; }

    .container {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .sky {
      position: absolute;
      width: 100%;
      height: 100%;
      animation: skyChange 20s ease-in-out infinite;
    }

    @keyframes skyChange {
      0%, 100% { background: linear-gradient(to bottom, #0a0a1a 0%, #1a1a3a 100%); }
      15% { background: linear-gradient(to bottom, #1a1a4a 0%, #ff6b4a 100%); }
      25% { background: linear-gradient(to bottom, #2a5298 0%, #87ceeb 100%); }
      35%, 55% { background: linear-gradient(to bottom, #4a90d9 0%, #87ceeb 100%); }
      65% { background: linear-gradient(to bottom, #2d1b4e 0%, #ff4500 100%); }
      75% { background: linear-gradient(to bottom, #0a0a1a 0%, #1a1a3a 100%); }
    }

    .stars {
      position: absolute;
      width: 100%;
      height: 70%;
      animation: starsVisibility 20s ease-in-out infinite;
    }

    @keyframes starsVisibility {
      0%, 15% { opacity: 1; }
      25%, 65% { opacity: 0; }
      75%, 100% { opacity: 1; }
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .sun {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff9c4 0%, #ffeb3b 30%, #ff9800 100%);
      box-shadow: 0 0 60px 20px rgba(255, 235, 59, 0.6), 0 0 100px 40px rgba(255, 152, 0, 0.3);
      animation: sunPath 20s ease-in-out infinite;
    }

    @keyframes sunPath {
      0%, 15% { left: 5%; top: 90%; opacity: 0; }
      20% { left: 15%; top: 70%; opacity: 1; }
      40% { left: 50%; top: 15%; opacity: 1; }
      60% { left: 85%; top: 70%; opacity: 1; }
      65%, 100% { left: 95%; top: 90%; opacity: 0; }
    }

    .moon {
      position: absolute;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #f5f5f5 0%, #e0e0e0 50%, #bdbdbd 100%);
      box-shadow: 0 0 30px 10px rgba(255, 255, 255, 0.3);
      animation: moonPath 20s ease-in-out infinite;
    }

    @keyframes moonPath {
      0% { left: 50%; top: 20%; opacity: 1; }
      10% { left: 85%; top: 60%; opacity: 1; }
      15%, 65% { left: 95%; top: 90%; opacity: 0; }
      70% { left: 5%; top: 90%; opacity: 0; }
      75% { left: 15%; top: 60%; opacity: 1; }
      90% { left: 50%; top: 15%; opacity: 1; }
      100% { left: 50%; top: 20%; opacity: 1; }
    }

    .moon::before, .moon::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      background: rgba(0,0,0,0.1);
    }
    .moon::before { width: 10px; height: 10px; top: 20%; left: 25%; }
    .moon::after { width: 15px; height: 15px; top: 55%; left: 35%; }

    .hills {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 25%;
    }

    .hill {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: rgba(0, 30, 0, 0.85);
    }

    .hill1 {
      height: 100%;
      border-radius: 100% 100% 0 0;
      transform: scaleX(2);
      left: -25%;
      background: rgba(0, 20, 0, 0.7);
    }

    .hill2 {
      height: 80%;
      border-radius: 100% 100% 0 0;
      transform: scaleX(1.5);
      left: 20%;
      background: rgba(0, 30, 0, 0.8);
    }

    .hill3 {
      height: 60%;
      border-radius: 100% 100% 0 0;
      transform: scaleX(2);
      left: 50%;
      background: rgba(0, 40, 0, 0.9);
    }

    .info {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      font-size: 14px;
      opacity: 0.7;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sky"></div>
    <div class="stars" id="stars"></div>
    <div class="sun"></div>
    <div class="moon"></div>
    <div class="hills">
      <div class="hill hill1"></div>
      <div class="hill hill2"></div>
      <div class="hill hill3"></div>
    </div>
    <div class="info">Day/Night Sky Animation • 20s loop</div>
  </div>

  <script>
    // Generate stars
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 100; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      const size = 1 + Math.random() * 3;
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.animationDelay = Math.random() * 2 + 's';
      starsContainer.appendChild(star);
    }
  </script>
</body>
</html>
